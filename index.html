<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Working with Others 電子書</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: an open book. Left page = big read-aloud text, right page = teacher's notes. One page at a time on narrow screens. */
:root{
  --desk:#d9e6ec; --paperL:#fffef9; --paperR:#eaf3f9; --card:#ffffff;
  --ink:#1f2a44; --ink2:#52607f; --line:#c5d3e0; --accent:#0f857d; --accent-ink:#ffffff;
  --accent-soft:#d6f0ec; --hl:#ffe27a; --hl-ink:#1f2a44; --coral:#d9483c; --coral-soft:#fde6e3;
  --blue:#2459c9; --red:#c92a2a; --green:#177a43; --gray:#5b667f; --warn:#fff3c4;
  --spine:rgba(31,42,68,.18); --shadow:0 10px 30px rgba(31,42,68,.18);
  --f-display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --f-read:"Andika","Trebuchet MS","Noto Sans TC",system-ui,sans-serif;
  --f-ui:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0d1320; --paperL:#1c2438; --paperR:#162033; --card:#222c44;
    --ink:#eef2ff; --ink2:#aab6d3; --line:#34425f; --accent:#43cfc2; --accent-ink:#06211f;
    --accent-soft:#17403e; --hl:#7a6516; --hl-ink:#fff7d6; --coral:#ff8a7d; --coral-soft:#4a2723;
    --blue:#8db4ff; --red:#ff8c8c; --green:#6fdc9a; --gray:#a3aecb; --warn:#4b3f12;
    --spine:rgba(0,0,0,.5); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0d1320; --paperL:#1c2438; --paperR:#162033; --card:#222c44;
  --ink:#eef2ff; --ink2:#aab6d3; --line:#34425f; --accent:#43cfc2; --accent-ink:#06211f;
  --accent-soft:#17403e; --hl:#7a6516; --hl-ink:#fff7d6; --coral:#ff8a7d; --coral-soft:#4a2723;
  --blue:#8db4ff; --red:#ff8c8c; --green:#6fdc9a; --gray:#a3aecb; --warn:#4b3f12;
  --spine:rgba(0,0,0,.5); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);
  padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;max-width:1500px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--ink2);font-size:.78rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500;min-height:40px}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tb svg{width:18px;height:18px;flex:none}
.tb:focus-visible,.btn:focus-visible,.chip:focus-visible,.blank:focus-visible,.sent:focus-visible,.toc-item:focus-visible,.vcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* the book */
.book{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;position:relative;border-radius:18px;box-shadow:var(--shadow)}
.book::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:26px;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--spine) 50%,transparent);z-index:3;border-radius:6px}
.page{position:relative;min-width:0;overflow-y:auto;overflow-x:hidden;padding:clamp(16px,2.6vw,34px);overscroll-behavior:contain;scrollbar-width:thin}
.page.left{background:var(--paperL);border-radius:18px 0 0 18px;font-family:var(--f-read);
  padding-bottom:0}
.page.right{background:var(--paperR);border-radius:0 18px 18px 0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;background-attachment:local;background-position:0 12px}
.page.right>*{position:relative}
.book.turn-next .page.right{animation:turnNext .38s ease both;transform-origin:left center}
.book.turn-prev .page.left{animation:turnPrev .38s ease both;transform-origin:right center}
@keyframes turnNext{from{transform:perspective(1400px) rotateY(-24deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes turnPrev{from{transform:perspective(1400px) rotateY(24deg);opacity:.2}to{transform:none;opacity:1}}

/* left page reading */
.read{font-size:calc(var(--fs)*clamp(1.55rem,2.5vw,2.25rem));line-height:1.75;color:var(--ink)}
.read p{margin:0 0 .7em}
.read h2.title{font-family:var(--f-display);font-weight:600;font-size:1.5em;line-height:1.15;margin:.1em 0 .1em}
.read .by{font-size:.62em;color:var(--ink2);margin:0 0 .6em}
.read h3{font-family:var(--f-display);font-weight:600;font-size:1.25em;margin:.5em 0 .3em;line-height:1.2}
.read .label{font-family:var(--f-ui);font-size:.5em;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:1em 0 .2em}
.read ul{list-style:none;margin:0 0 .7em;padding:0}
.read li{position:relative;padding-left:1.3em;margin:.1em 0}
.read li::before{content:"";position:absolute;left:.15em;top:.62em;width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
.sent{border-radius:8px;padding:.04em .08em;cursor:pointer;transition:background .15s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sent:hover{background:var(--accent-soft)}
.sent.sel{outline:2px dashed var(--accent);outline-offset:2px}
.sent.now{background:var(--hl);color:var(--hl-ink)}
.sent.rec::after{content:"";display:inline-block;width:.38em;height:.38em;border-radius:50%;background:var(--coral);margin-left:.25em;vertical-align:.25em}
.vw{border-bottom:3px dotted var(--accent);cursor:help}
.chipsrow{display:flex;flex-wrap:wrap;gap:10px;margin:.3em 0 .8em}
.pw{font-family:var(--f-display);font-weight:500;background:var(--accent-soft);border:2px solid var(--accent);border-radius:14px;padding:.1em .6em;font-size:.95em}
.art{background:#fff8e4;border:3px solid #2b3550;border-radius:16px;padding:6px;margin:0 0 14px;width:fit-content;max-width:100%}
.art svg{display:block;height:clamp(140px,26vh,240px);width:auto;max-width:100%;filter:url(#rough)}
.gloss{position:fixed;z-index:30;background:var(--ink);color:var(--paperL);padding:8px 14px;border-radius:12px;font-family:var(--f-ui);font-size:1rem;font-weight:500;box-shadow:var(--shadow);pointer-events:none;max-width:70vw}
.gloss i{font-style:normal;opacity:.75;margin-left:8px;font-family:var(--f-read);font-size:.9em}

/* dock */
.dock{position:sticky;bottom:0;margin:12px calc(-1*clamp(16px,2.6vw,34px)) 0;padding:10px clamp(16px,2.6vw,34px) 12px;background:var(--paperL);
  border-top:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-ui);z-index:4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:700;font-size:.95rem;min-height:46px;color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.rec{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.btn.recording{background:var(--coral);color:#fff;border-color:var(--coral);animation:pulse 1s infinite}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:5px 10px;font-size:.85rem;border-radius:11px}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(217,72,60,.25)}}
.dock .sep{width:2px;align-self:stretch;background:var(--line);margin:0 2px}
.dock .hint{font-size:.85rem;color:var(--ink2);flex:1 1 180px;min-width:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 11px;font-size:.85rem;font-weight:700;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* right page */
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.rh h2{font-family:var(--f-display);font-size:1.45rem;margin:0;font-weight:600}
.rh span{color:var(--ink2);font-size:.85rem}
.sec{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.sec>h3{margin:0 0 10px;font-size:1rem;font-family:var(--f-display);font-weight:600;display:flex;align-items:center;gap:8px}
.sec>h3 small{color:var(--ink2);font-family:var(--f-ui);font-weight:400;font-size:.8rem}
.sec.parent{background:var(--warn);border-color:#e3c24b}
.sec.exam{background:var(--accent-soft);border-color:var(--accent)}
.sec p{margin:.2em 0;line-height:1.65}
.tr{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px dashed var(--line);padding:9px 8px;border-radius:8px}
.tr:last-child{border-bottom:0}
.tr .en{font-family:var(--f-read);font-weight:700;font-size:1.05rem;line-height:1.5;display:block}
.tr .zh{color:var(--ink2);font-size:1rem;line-height:1.55;display:block}
.tr.now{background:var(--hl);color:var(--hl-ink)}
.tr.now .zh{color:var(--hl-ink)}
.tr:hover{background:var(--accent-soft)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vcard{background:var(--paperR);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:block;width:100%}
.vcard:hover{border-color:var(--accent)}
.vcard .w{font-family:var(--f-read);font-weight:700;font-size:1.15rem;display:flex;gap:8px;align-items:center}
.vcard .w svg{width:18px;height:18px;color:var(--accent)}
.vcard .ipa{font-family:var(--f-read);color:var(--ink2);font-size:.9rem}
.vcard .zh{font-weight:700;margin:2px 0}
.vcard .ex{font-family:var(--f-read);font-size:.9rem;color:var(--ink2);line-height:1.4}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding:5px 2px;flex-wrap:wrap}
.plist .e{font-family:var(--f-read);font-weight:700;color:var(--ink)}
.plist .z{color:var(--ink2)}
.pat{margin:0 0 12px}
.pat .pt{font-weight:700;font-size:.9rem;margin-bottom:5px}
.pat .row{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-read);font-size:1.1rem}
.pat .row span{padding:4px 10px;border-radius:9px;border:2px solid;font-weight:700;line-height:1.3}
.r-S{color:var(--blue);border-color:var(--blue)}
.r-V{color:var(--red);border-color:var(--red)}
.r-O{color:var(--green);border-color:var(--green)}
.r-X{color:var(--gray);border-color:var(--line);font-weight:400!important}
.pat .note{color:var(--ink2);font-size:.9rem;margin-top:5px;line-height:1.55}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;font-size:.8rem}
.legend span{padding:2px 9px;border-radius:999px;border:2px solid;font-weight:700}
table.vt{width:100%;border-collapse:collapse;font-family:var(--f-read)}
table.vt th{font-family:var(--f-ui);font-size:.8rem;color:var(--ink2);text-align:left;padding:4px 6px;border-bottom:2px solid var(--line)}
table.vt td{padding:7px 6px;border-bottom:1px dashed var(--line);font-size:1.05rem}
table.vt td.z{font-family:var(--f-ui);color:var(--ink2);font-size:.95rem}
table.vt td.irr{color:var(--coral);font-weight:700}
table.vt tr{cursor:pointer}
table.vt tr:hover td{background:var(--accent-soft)}
.vtwrap{overflow-x:auto}
.legend2{font-size:.8rem;color:var(--ink2);margin-top:6px}
.legend2 b{color:var(--coral)}

/* test prep */
.qbadge{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 14px;font-family:var(--f-display);font-weight:500;margin-bottom:12px;font-size:1rem}
.qtext{font-size:calc(var(--fs)*clamp(1.5rem,2.4vw,2.1rem));line-height:1.4;font-weight:700;margin:0 0 .15em}
.qzh{font-family:var(--f-ui);color:var(--ink2);font-size:calc(var(--fs)*1.05rem);margin:0 0 14px}
.hintbox{background:var(--warn);border:2px solid #e3c24b;border-radius:14px;padding:10px 14px;font-family:var(--f-ui);line-height:1.6;margin:0 0 16px}
.hintbox b{display:block;font-size:.8rem;letter-spacing:.06em;margin-bottom:2px}
.frame{font-size:calc(var(--fs)*clamp(1.4rem,2.2vw,2rem));line-height:2.3;margin:0 0 14px}
.frame .ln{display:block;margin-bottom:.3em}
.frame .lab{font-family:var(--f-ui);font-size:.55em;font-weight:700;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 8px;margin-right:6px;vertical-align:middle}
.blank{display:inline-block;min-width:3.2em;border:0;border-bottom:4px solid var(--accent);background:var(--accent-soft);color:var(--ink);font:inherit;font-weight:700;padding:0 .4em;margin:0 .1em;border-radius:8px 8px 0 0;line-height:1.5;vertical-align:baseline;text-align:center}
.blank.cur{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 3px var(--accent)}
.blank.ok{background:transparent;border-bottom-color:var(--green);color:var(--green)}
.blank .h{opacity:.55;font-weight:400}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
.chip{font-family:var(--f-read);font-weight:700;font-size:calc(var(--fs)*1.25rem);border:2px solid var(--accent);background:var(--card);color:var(--ink);border-radius:14px;padding:6px 16px;min-height:50px}
.chip.used{opacity:.3;pointer-events:none}
.chip.bad{animation:shake .35s;border-color:var(--red);background:var(--coral-soft)}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.win{background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;padding:12px 16px;font-family:var(--f-ui);font-weight:700;margin:0 0 12px;font-size:1.05rem;line-height:1.5}
.ans{font-family:var(--f-read);font-size:1.15rem;line-height:1.7;font-weight:700}
.reveal{width:100%;border-style:dashed}
.jumps{display:flex;flex-wrap:wrap;gap:8px}

/* covers & toc */
.cover{display:grid;place-items:center;height:100%;padding:0}
.page.left.coverpg{padding:0;background:#0f857d}
.page.left.coverpg .art{width:100%;max-width:none;height:100%;margin:0;border:0;border-radius:0;background:transparent;padding:0}
.page.left.coverpg .art svg{height:100%;width:100%;filter:url(#rough2)}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;line-height:1.6}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.tpgrid{display:grid;gap:8px}
.tpitem{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.tpitem:hover{border-color:var(--accent)}
.tpitem .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.tpitem .t{flex:1;min-width:0}
.tpitem .t b{display:block;font-family:var(--f-read)}
.tpitem .t small{color:var(--ink2)}
.star{width:22px;height:22px;color:var(--line);flex:none}
.star.on{color:#f2b705}

.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager .mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.flip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 22px;min-height:50px;font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.flip svg{width:22px;height:22px}
.flip[disabled]{opacity:.35;cursor:not-allowed}
.pn{font-family:var(--f-display);color:var(--ink2);font-size:.95rem;text-align:center}
.pn b{color:var(--ink)}
.tabs{display:none}
.stars{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.stars svg{width:20px;height:20px;color:#f2b705}

.toc{position:fixed;inset:0;z-index:40;background:rgba(10,16,30,.55);display:flex;justify-content:flex-start}
.toc[hidden]{display:none}
.toc .panel{width:min(440px,92vw);height:100%;background:var(--paperR);overflow:auto;padding:max(18px,env(safe-area-inset-top,0px)) 16px 24px;box-shadow:var(--shadow)}
.toc h2{font-family:var(--f-display);margin:.2em 0 .5em}
.toc h4{margin:16px 0 6px;color:var(--ink2);font-size:.85rem;letter-spacing:.06em}
.toc-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.toc-item.cur{border-color:var(--accent);background:var(--accent-soft)}
.toc-item span.t{flex:1;min-width:0;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paperL);padding:10px 18px;border-radius:999px;font-weight:500;z-index:60;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:900px){
  .book{grid-template-columns:1fr}
  .book::after{display:none}
  .page.left{border-radius:18px}
  .page.right{border-radius:18px}
  .book[data-side="L"] .page.right{display:none}
  .book[data-side="R"] .page.left{display:none}
  .tabs{display:inline-flex}
  .brand small{display:none}
  .read{font-size:calc(var(--fs)*1.6rem)}
}
@media (max-width:560px){
  .tb span.lbl{display:none}
  .tb{padding:7px 10px}
  .flip span{display:none}
  .flip{padding:8px 16px}
}
@media (prefers-reduced-motion:reduce){
  .book.turn-next .page.right,.book.turn-prev .page.left{animation:none}
  .btn.recording{animation:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="rough" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
<filter id="rough2" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/></filter>
</defs></svg>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg></div>
      <div><b>Working with Others</b><small>by Robin Nelson · 課本 pp.228–238</small></div>
    </div>

/* ============ 狀態 ============ */
const S = { voiceURI: null, i: 0, side: 'L', auto: true, slow: false, fs: 1, mode: 'tts', sel: null, playing: false, recKey: null, reveal: {}, uploadKey: null };
const P = { done: {} };
const PKEY = 'wwo-ebook-v1';
function loadP() {
  try {
    const j = JSON.parse(localStorage.getItem(PKEY) || '{}');
    P.done = j.done || {};
    if (typeof j.i === 'number') S.i = Math.min(Math.max(0, j.i), SPREADS.length - 1);
    if (j.fs) S.fs = j.fs; if (j.auto != null) S.auto = j.auto; if (j.slow != null) S.slow = j.slow; if (j.mode) S.mode = j.mode; if (j.voiceURI) S.voiceURI = j.voiceURI;
  } catch (e) { }
}
function saveP() { try { localStorage.setItem(PKEY, JSON.stringify({ done: P.done, i: S.i, fs: S.fs, auto: S.auto, slow: S.slow, mode: S.mode, voiceURI: S.voiceURI })); } catch (e) { } }

/* ============ 資料前處理 ============ */
SPREADS.forEach(sp => {
  if (sp.kind === 'read') {
    sp.sents = []; let n = 0;
    sp.left.forEach(b => { if (b.s) b.s.forEach(x => { x.idx = n++; x.key = sp.id + ':' + x.idx; sp.sents.push(x); }); });
    const alts = sp.vocab.map(v => v[4] || reEsc(v[0])).sort((a, b) => b.length - a.length);
    sp._re = new RegExp('\\b(?:' + alts.join('|') + ')\\b', 'gi');
    sp._vre = sp.vocab.map(v => new RegExp('^(?:' + (v[4] || reEsc(v[0])) + ')$', 'i'));
  }
});
const QSTATE = {};
QS.forEach(q => {
  SPREADS.push({ id: 'q' + q.no, kind: 'q', label: `第 ${q.no} 題 · ${q.cat}`, q });
  q.blanks = [...q.frame.matchAll(/\{\{(.+?)\}\}/g)].map(m => m[1]);
  q.full = q.frame.replace(/\{\{(.+?)\}\}/g, '$1');
  let seed = q.no * 7919; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  q.shuf = [...q.bank].sort(() => rnd() - .5);
  QSTATE[q.no] = { fills: q.blanks.map(() => null), hint: {}, done: !!P.done['q' + q.no] };
});
const SP = () => SPREADS[S.i];
const countable = SPREADS.filter(s => s.kind === 'read' || s.kind === 'q');

/* ============ 朗讀（瀏覽器內建語音） ============ */
let voice = null, token = 0, warned = false;
const cur = { cancel: null };
function loadVoices() {
  try {
    const vs = speechSynthesis.getVoices(); if (!vs.length) return;
    const en = vs.filter(v => /^en[-_]US/i.test(v.lang));
    const pref = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Ava', 'Allison', 'Nicky', 'Karen', 'Zira'];
    const good = en.filter(v => /premium|enhanced|高級|強化/i.test(v.name));
    voice = vs.find(v => v.voiceURI === S.voiceURI) || pref.map(p => good.find(v => v.name.includes(p))).find(Boolean) || good[0] || pref.map(p => en.find(v => v.name.includes(p))).find(Boolean) || en[0] || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (e) { }
}
try { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } catch (e) { }
const rate = () => S.slow ? 0.65 : 0.95;
function speakText(text) {
  return new Promise(res => {
    if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
      if (!warned) { warned = true; toast('這個瀏覽器沒有朗讀功能，請改用 Chrome 或 Safari。'); }
      res(); return;
    }
    let done = false; const fin = () => { if (!done) { done = true; clearTimeout(tm); res(); } };
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = rate();
    u.onend = fin; u.onerror = fin;
    const tm = setTimeout(fin, Math.max(3500, text.length * 200 / rate()));
    cur.cancel = () => { try { speechSynthesis.cancel(); } catch (e) { } fin(); };
    try { speechSynthesis.speak(u); } catch (e) { fin(); }
  });
}
function playBlob(blob) {
  return new Promise(res => {
    const url = URL.createObjectURL(blob); const a = new Audio(url); let done = false;
    const fin = () => { if (!done) { done = true; URL.revokeObjectURL(url); res(); } };
    a.onended = fin; a.onerror = fin;
    cur.cancel = () => { try { a.pause(); } catch (e) { } fin(); };
    a.play().catch(fin);
  });
}
function stopAll() {
  token++;
  if (cur.cancel) { const c = cur.cancel; cur.cancel = null; c(); }
  try { speechSynthesis.cancel(); } catch (e) { }
  setNow(null); S.playing = false; updDock();
}
async function playItems(items, opts = {}) {
  const { mark = true, useMine = true } = opts;
  stopAll(); const my = token; S.playing = true; updDock(); await sleep(160);
  for (const it of items) {
    if (my !== token) return false;
    if (mark && it.idx != null) setNow(it.idx);
    const blob = (useMine && S.mode === 'mine' && it.key) ? await recGet(it.key) : null;
    if (my !== token) return false;
    if (blob) await playBlob(blob); else await speakText(it.text ?? it.en);
  }
  if (my !== token) return false;
  S.playing = false; setNow(null); updDock(); return true;
}
function setNow(idx) {
  $$('.now').forEach(e => e.classList.remove('now'));
  if (idx == null) return;
  const a = $('#s-' + idx), b = $('#t-' + idx);
  if (a) { a.classList.add('now'); a.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  if (b) { b.classList.add('now'); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

/* ============ 錄音（存在這台裝置的瀏覽器裡） ============ */
const DB = { db: null, mem: new Map(), keys: new Set() };
function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open('wwo-ebook', 1); r.onupgradeneeded = () => r.result.createObjectStore('rec'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
async function recInit() {
  try {
    DB.db = await idb();
    const keys = await new Promise((res, rej) => { const q = DB.db.transaction('rec').objectStore('rec').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    keys.forEach(k => DB.keys.add(k));
  } catch (e) { DB.db = null; }
}
function recGet(k) {
  if (!DB.db) return Promise.resolve(DB.mem.get(k) || null);
  return new Promise(res => { try { const q = DB.db.transaction('rec').objectStore('rec').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } });
}
function recSet(k, blob) {
  DB.keys.add(k);
  if (!DB.db) { DB.mem.set(k, blob); return Promise.resolve(); }
  return new Promise(res => { try { const tx = DB.db.transaction('rec', 'readwrite'); tx.objectStore('rec').put(blob, k); tx.oncomplete = res; tx.onerror = res; } catch (e) { DB.mem.set(k, blob); res(); } });
}
function recDel(k) {
  DB.keys.delete(k); DB.mem.delete(k);
  if (!DB.db) return Promise.resolve();
  return new Promise(res => { try { const tx = DB.db.transaction('rec', 'readwrite'); tx.objectStore('rec').delete(k); tx.oncomplete = res; tx.onerror = res; } catch (e) { res(); } });
}
const REC = { mr: null, stream: null, blocked: false };
async function toggleRec(key) {
  if (REC.mr) { REC.mr.stop(); return; }
  stopAll();
  if (!REC.blocked && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(m => MediaRecorder.isTypeSupported(m)) || '';
      const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); const chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        REC.mr = null; S.recKey = null;
        if (blob.size > 800) { await recSet(key, blob); toast('錄好了！按「聽我的」就能聽到自己的聲音'); } else toast('錄音太短了，再試一次');
        afterRecChange();
      };
      REC.mr = mr; S.recKey = key; mr.start(); updDock(); toast('錄音中⋯⋯說完請按「停止錄音」');
      return;
    } catch (e) { REC.blocked = true; }
  } else REC.blocked = true;
  S.uploadKey = key;
  toast('這個頁面目前不能直接用麥克風。請先用手機或平板的「錄音機」錄好，再選擇檔案。', 4800);
  $('#upl').value = ''; $('#upl').click();
}
$('#upl').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f || !S.uploadKey) return;
  await recSet(S.uploadKey, f); S.uploadKey = null; toast('已存好這段聲音'); afterRecChange();
});
function afterRecChange() {
  const sp = SP();
  if (sp.kind === 'read') $$('.sent').forEach(e => { const x = sp.sents[+e.dataset.i]; e.classList.toggle('rec', !!(x && DB.keys.has(x.key))); });
  updDock();
}
async function playMine(key) {
  const blob = await recGet(key); if (!blob) { toast('這裡還沒有錄音'); return false; }
  stopAll(); const my = token; S.playing = true; updDock(); await playBlob(blob);
  if (my === token) { S.playing = false; updDock(); } return true;
}

/* ============ 畫面小幫手 ============ */
let toastTm;
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('show'), ms); }
function starsHtml(n) { return ICON.star.replace('class="star"', 'class="star' + (n ? ' on' : '') + '"'); }

/* ============ 左頁：課文 ============ */
function sentHtml(x, sp, extra = '') {
  const html = esc(x.en).replace(sp._re, m => { const k = sp._vre.findIndex(r => r.test(m)); return `<span class="vw" data-act="vw" data-k="${k}">${m}</span>`; });
  return `<span class="sent${DB.keys.has(x.key) ? ' rec' : ''}${S.sel === x.idx ? ' sel' : ''}${extra}" id="s-${x.idx}" data-act="sent" data-i="${x.idx}" tabindex="0" role="button">${html}</span>`;
}
function leftRead(sp) {
  let h = `<div class="art">${ART[sp.art]()}</div><div class="read">`, inUl = false;
  const closeUl = () => { if (inUl) { h += '</ul>'; inUl = false; } };
  sp.left.forEach(b => {
    if (b.k !== 'li') closeUl();
    if (b.k === 'title') h += `<h2 class="title">${sentHtml(b.s[0], sp)}</h2><p class="by">${esc(b.by)}</p>`;
    else if (b.k === 'h') h += `<h3>${sentHtml(b.s[0], sp)}</h3>`;
    else if (b.k === 'label') h += `<div class="label">${esc(b.text)}</div>`;
    else if (b.k === 'p') h += `<p>${b.s.map(x => sentHtml(x, sp)).join(' ')}</p>`;
    else if (b.k === 'li') { if (!inUl) { h += '<ul>'; inUl = true; } h += `<li>${b.s.map(x => sentHtml(x, sp)).join(' ')}</li>`; }
    else if (b.k === 'words') h += `<div class="chipsrow">${b.s.map(x => `<span class="sent pw${DB.keys.has(x.key) ? ' rec' : ''}" id="s-${x.idx}" data-act="sent" data-i="${x.idx}" tabindex="0" role="button">${esc(x.en)}</span>`).join('')}</div>`;
  });
  closeUl(); h += '</div><div class="dock" id="dock"></div>';
  return h;
}
function updDock() {

    const x = S.sel != null ? sp.sents[S.sel] : null, key = x && x.key, has = key && DB.keys.has(key), isRec = S.recKey && S.recKey === key;

      <span class="sep"></span>
      ${isRec ? `<button class="btn recording" data-act="rec">${ICON.stop}停止錄音</button>` : `<button class="btn rec" data-act="rec" ${x ? '' : 'disabled'}>${ICON.mic}錄這句</button>`}

      <div class="hint">${x ? '選取的句子：' + esc(x.en.length > 34 ? x.en.slice(0, 34) + '…' : x.en) : '點一句課文，就能聽、能錄那一句。虛線單字可以點來看中文。'}</div>`;
  } else if (sp.kind === 'q') {
    const q = sp.q, st = QSTATE[q.no], key = 'q' + q.no, has = DB.keys.has(key), isRec = S.recKey === key, ok = st.done || S.reveal[q.no];
    d.innerHTML = `
      ${S.playing ? `<button class="btn pri" data-act="stop">${ICON.stop}停止</button>` : `<button class="btn pri" data-act="qans" ${ok ? '' : 'disabled'}>${ICON.spk}聽完整答案</button>`}
      ${isRec ? `<button class="btn recording" data-act="rec">${ICON.stop}停止錄音</button>` : `<button class="btn rec" data-act="rec">${ICON.mic}錄我的回答</button>`}
      <button class="btn" data-act="mine" ${has ? '' : 'disabled'}>${ICON.play}聽我的</button>

      const q = sp.q, text = q.full.replace(/\n/g, ' ').replace(/(Beginning|Middle|End):\s*/g, '');
      const ok = await playItems([{ text }], { mark: false, useMine: false });
      if (ok) await playMine('q' + q.no); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.sent')) { e.preventDefault(); e.target.click(); return; }
  if (e.target.matches && e.target.matches('input,textarea')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
});
$('#bNext').onclick = () => go(1);
$('#bPrev').onclick = () => go(-1);
$('#bToc').onclick = openToc;
$('#bVoice').onclick = openVoices;
$('#toc').addEventListener('click', e => { if (e.target.id === 'toc') $('#toc').hidden = true; });
$('#bAuto').onclick = () => { S.auto = !S.auto; $('#bAuto').setAttribute('aria-pressed', S.auto); saveP(); toast(S.auto ? '翻到新的一頁會自動朗讀' : '翻頁後不會自動朗讀'); };
$('#bSlow').onclick = () => { S.slow = !S.slow; $('#bSlow').setAttribute('aria-pressed', S.slow); saveP(); toast(S.slow ? '慢速朗讀' : '正常速度朗讀'); };
$('#bSmall').onclick = () => { S.fs = Math.max(.8, +(S.fs - .1).toFixed(1)); document.documentElement.style.setProperty('--fs', S.fs); saveP(); };
$('#bBig').onclick = () => { S.fs = Math.min(1.6, +(S.fs + .1).toFixed(1)); document.documentElement.style.setProperty('--fs', S.fs); saveP(); };
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.side = b.dataset.side; $('#book').dataset.side = S.side; $$('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
let tx = 0, ty = 0;
$('#book').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#book').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 90 && Math.abs(dy) < 50) go(dx < 0 ? 1 : -1); }, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });

/* ============ 開始 ============ */
(async function start() {
  loadP();
  QS.forEach(q => { QSTATE[q.no].done = !!P.done['q' + q.no]; if (QSTATE[q.no].done) QSTATE[q.no].fills = [...q.blanks]; });
  await recInit();
  render();
})();
</script>
